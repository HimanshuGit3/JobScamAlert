name: GitHub Pages

# Static demo: the UI with the deterministic engine running in the browser
# (VITE_STATIC_MODE). Gemini and Safe Browsing need the server (Cloud Run).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build static site
        run: npx tsc --noEmit && npx vite build --base="/${GITHUB_REPOSITORY#*/}/"
        env:
          VITE_STATIC_MODE: "true"
      - name: Publish to the gh-pages branch
        working-directory: frontend/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898183+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
